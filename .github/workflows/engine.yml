name: Build slim web engine

# A smaller Godot web export template for every Brainnova game: 2D only, no
# complex-script text shaping, none of the modules these games never use.
# Roughly half the download of the stock template, so games open faster.
#
# Run it by hand (Actions > Build slim web engine > Run) once per Godot version.
# It publishes a release "engine-<version>" with web_nothreads_release.zip,
# which each game's CI downloads and uses as its Web export template
# (see RULES_FOR_MAKING_GAME.md, "Web build").

on:
  workflow_dispatch:
    inputs:
      godot:
        description: Godot release tag
        default: 4.7.2-stable

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get Godot source
        run: git clone --depth 1 --branch "${{ inputs.godot }}" https://github.com/godotengine/godot.git godot

      - name: Emscripten version Godot was released with
        id: em
        run: |
          v=$(grep -m1 -oE 'EM_VERSION: *[0-9.]+' godot/.github/workflows/web_builds.yml | grep -oE '[0-9.]+$')
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          echo "Emscripten ${v}"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.em.outputs.version }}

      - name: Install SCons
        run: python3 -m pip install scons

      - name: Build
        working-directory: godot
        run: |
          scons platform=web target=template_release threads=no production=yes \
            optimize=size lto=full disable_3d=yes \
            module_text_server_adv_enabled=no module_text_server_fb_enabled=yes \
            module_csg_enabled=no module_gridmap_enabled=no module_gltf_enabled=no module_fbx_enabled=no \
            module_openxr_enabled=no module_webxr_enabled=no module_mobile_vr_enabled=no \
            module_lightmapper_rd_enabled=no module_xatlas_unwrap_enabled=no module_raycast_enabled=no \
            module_vhacd_enabled=no module_meshoptimizer_enabled=no module_theora_enabled=no \
            module_upnp_enabled=no module_enet_enabled=no module_multiplayer_enabled=no \
            module_webrtc_enabled=no module_websocket_enabled=no module_jsonrpc_enabled=no \
            module_regex_enabled=no module_camera_enabled=no module_noise_enabled=no \
            module_navigation_2d_enabled=no module_navigation_3d_enabled=no \
            module_jolt_physics_enabled=no module_godot_physics_3d_enabled=no \
            module_interactive_music_enabled=no module_mp3_enabled=no module_tinyexr_enabled=no module_objectdb_profiler_enabled=no \
            module_basis_universal_enabled=no module_astcenc_enabled=no module_etcpak_enabled=no \
            module_bcdec_enabled=no module_cvtt_enabled=no module_ktx_enabled=no module_dds_enabled=no \
            module_hdr_enabled=no module_tga_enabled=no
          ls -l bin

      - name: Package
        run: |
          mkdir out
          cp godot/bin/godot.web.template_release.wasm32.nothreads.zip out/web_nothreads_release.zip
          unzip -l out/web_nothreads_release.zip
          unzip -p out/web_nothreads_release.zip godot.wasm | wc -c

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="engine-${{ inputs.godot }}"
          gh release delete "$tag" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$tag" out/web_nothreads_release.zip -R "$GITHUB_REPOSITORY" \
            --title "Slim web engine, Godot ${{ inputs.godot }}" \
            --notes "2D-only Godot web export template (no threads) for Brainnova games. Built by .github/workflows/engine.yml."
