<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3A2F7A"/>
      <stop offset="0.55" stop-color="#241E52"/>
      <stop offset="1" stop-color="#15122F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B5B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF6B5B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="505" y1="292" x2="652" y2="586">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- the wall the shot banks off -->
  <rect x="360" y="206" width="290" height="60" rx="30" fill="#F4F1FF"/>
  <!-- first leg: launcher up to the wall, dotted -->
  <g fill="#FFFFFF" opacity="0.5"><circle cx="287" cy="705" r="13"/><circle cx="317" cy="645" r="13"/><circle cx="347" cy="585" r="13"/><circle cx="377" cy="525" r="13"/><circle cx="407" cy="465" r="13"/><circle cx="437" cy="405" r="13"/><circle cx="467" cy="345" r="13"/></g>
  <!-- the bounce: a small flash where the orb meets the wall -->
  <g stroke="#FFC9A8" stroke-width="12" stroke-linecap="round">
    <line x1="500" y1="292" x2="500" y2="330"/>
    <line x1="466" y1="296" x2="446" y2="322"/>
    <line x1="534" y1="296" x2="554" y2="322"/>
  </g>
  <!-- second leg (a true mirror bounce): a streak of light toward the target -->
  <path d="M 505 292 L 652 586" stroke="url(#trail)" stroke-width="40" stroke-linecap="round" fill="none"/>
  <!-- target -->
  <circle cx="740" cy="760" r="180" fill="url(#halo)"/>
  <circle cx="740" cy="760" r="104" fill="#FF6B5B"/>
  <circle cx="740" cy="760" r="46" fill="none" stroke="#FFF4EE" stroke-width="20"/>
  <!-- the orb, a moment before the hit -->
  <circle cx="660" cy="600" r="90" fill="url(#glow)"/>
  <circle cx="660" cy="600" r="42" fill="#FFFFFF"/>
  <!-- launcher -->
  <circle cx="250" cy="780" r="60" fill="none" stroke="#F4F1FF" stroke-width="18"/>
</svg>
